# 노드 수집기 — DaemonSet.
#
# 여기서는 DaemonSet 이 맞다. cgroup 파일시스템은 API 서버로 못 읽고
# 노드에 직접 접근해야 하므로, 노드마다 하나씩 떠야 그 노드의 컨테이너를 본다.
#
#   agent       Deployment 1개   API 서버 경유 · 클러스터 전체
#   node-agent  DaemonSet  N개   노드 로컬 · 그 노드의 cgroup
#
# 권한도 다르다. 이쪽은 cgroup 을 읽기 위해 hostPath 를 마운트하므로
# 노드 파일시스템에 닿는다. 읽기 전용으로 걸고, 필요한 경로만 준다.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: collector-node-agent
  namespace: collector
---
# 노드 수집기는 자기 노드의 파드 목록만 있으면 된다.
# cgroup 이 주는 것은 파드 UID 뿐이라, 이름과 네임스페이스를 잇기 위해서다.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: collector-node-agent
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: collector-node-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: collector-node-agent
subjects:
  - kind: ServiceAccount
    name: collector-node-agent
    namespace: collector
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: collector-node-agent
  namespace: collector
  labels:
    app.kubernetes.io/name: collector-node-agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: collector-node-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: collector-node-agent
    spec:
      serviceAccountName: collector-node-agent
      # 컨트롤 플레인 노드에도 떠야 한다. 단일 노드 클러스터에서는
      # 이 톨러레이션이 없으면 아무 데도 안 뜬다.
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: node-agent
          image: grpc-kubernetes-collector:dev
          imagePullPolicy: IfNotPresent
          command: ["/node-agent"]
          args:
            - "-kubeconfig="
            - "-addr=$(SERVER_ADDR)"
            - "-agent-id=$(NODE_NAME)"
            - "-node=$(NODE_NAME)"
            - "-cluster=$(CLUSTER_NAME)"
            - "-cgroup-root=/host/sys/fs/cgroup"
          env:
            - name: SERVER_ADDR
              value: "collector-server.collector.svc.cluster.local:50051"
            - name: CLUSTER_NAME
              valueFrom:
                configMapKeyRef:
                  name: collector-config
                  key: cluster
            # Downward API — 자기가 어느 노드에 떠 있는지 알아야
            # 그 노드의 파드만 조회할 수 있다.
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: cgroup
              mountPath: /host/sys/fs/cgroup
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
