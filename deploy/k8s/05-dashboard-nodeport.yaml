# 로컬(kind)에서 대시보드를 열기 위한 NodePort.
#
# 실제 운영이라면 Ingress 나 LoadBalancer 를 쓰고 인증을 앞에 둔다.
# 여기서는 확인이 목적이라 NodePort 로 한정하고, 같은 이유로
# 이 파일은 kustomize 오버레이처럼 선택 적용하도록 분리해 두었다.
apiVersion: v1
kind: Service
metadata:
  name: collector-dashboard
  namespace: collector
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: collector-server
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
