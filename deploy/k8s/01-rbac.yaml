# 수집기가 쓸 권한.
#
# cluster-admin 을 붙이면 배포는 되지만 최소 권한 원칙에 어긋난다.
# 수집기는 "읽기만" 하면 되므로 get · list 만 준다. watch 도 지금은 쓰지 않는다.
# 나중에 informer 로 바꾸면 그때 추가한다.
#
# Secret 은 목록과 메타데이터만 보고 값은 읽지 않는다. 다만 K8s RBAC 은
# "값은 빼고 메타만" 같은 구분을 제공하지 않으므로, get 권한이 곧 값 접근이다.
# 그래서 수집 코드에서 Data 를 절대 담지 않는 것으로 경계를 지킨다.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: collector-agent
  namespace: collector
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: collector-agent
rules:
  # 자원 메타데이터
  - apiGroups: [""]
    resources:
      - namespaces
      - pods
      - configmaps
      - secrets
      - serviceaccounts
    verbs: ["get", "list"]

  # 파드 로그
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]

  # 워크로드
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list"]

  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list"]

  # metrics-server 가 제공하는 사용량
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: collector-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: collector-agent
subjects:
  - kind: ServiceAccount
    name: collector-agent
    namespace: collector
